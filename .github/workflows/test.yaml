name: test

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          
      - name: pytest
        run: |
            python -m pip install --upgrade pip
            make devinstall
            make test
