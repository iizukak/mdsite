name: test

on:
  - push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"

      - name: pytest
        run: |
            uv lock --check
            make devinstall
            make typecheck
            make test
