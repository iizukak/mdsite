<!DOCTYPE html>
<html lang="{{config.lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{config.title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link rel="stylesheet" href="{{markdown.link_to_root}}mdsite.css">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [ ['$','$'], ["\\(","\\)"] ],
          displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
          processEscapes: true
        },
        options: {
          renderActions: {
            // python-markdown-math が出力する MathJax 2 形式の
            // <script type="math/tex"> を MathJax 4 の数式として登録する
            findScript: [10, function (doc) {
              for (const node of document.querySelectorAll('script[type^="math/tex"]')) {
                const display = !!node.type.match(/; *mode=display/);
                const math = new doc.options.MathItem(node.textContent, doc.inputJax[0], display);
                const text = document.createTextNode('');
                node.parentNode.replaceChild(text, node);
                math.start = {node: text, delim: '', n: 0};
                math.end = {node: text, delim: '', n: 0};
                doc.math.push(math);
              }
            }, '']
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  </head>
  <body>
    <header>
      <a href="{{markdown.link_to_root}}index.html">{{config.title}}</a>
    </header>
   {{contents}}
    <footer>
      <p>created at: {{created_at}}, updated at: {{updated_at}}</p>
      <p>{{config.author}} © {{year}}</p>
    </footer>
  </body>
</html>
